name: Daily Weather Aviation Sources

on:
  schedule:
    # Run daily at 6:00 AM Asia/Shanghai (UTC 22:00 previous day)
    # Avoids peak hours and NWS API rush
    - cron: '0 22 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD), defaults to today'
        required: false
        type: string
  # Also run on push to relevant source scripts
  push:
    paths:
      - 'scripts/generate-weather-aviation-sources.mjs'
      - 'scripts/fetch-noaa-forecast.mjs'
      - 'scripts/fetch-metar-taf.mjs'
      - 'poly-knowledge/notes/aviation-*.md'
      - 'poly-knowledge/notes/weather-*.md'

permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  generate-weather-aviation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Ensure outputs directory exists
        run: mkdir -p poly-knowledge/outputs
      
      - name: Generate weather aviation sources
        id: generate
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          # Get target date (from input or default to today)
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(date +%Y-%m-%d)
          fi
          echo "target_date=$TARGET_DATE" >> $GITHUB_OUTPUT
          echo "Running weather aviation sources generator for date: $TARGET_DATE"
          
          # Run the generator
          node scripts/generate-weather-aviation-sources.mjs
          
          # Check output files exist
          JSON_FILE="poly-knowledge/outputs/weather-aviation-sources-${TARGET_DATE}.json"
          MD_FILE="poly-knowledge/outputs/weather-aviation-sources-${TARGET_DATE}.md"
          
          if [ -f "$JSON_FILE" ] && [ -f "$MD_FILE" ]; then
            echo "json_exists=true" >> $GITHUB_OUTPUT
            echo "json_size=$(wc -c < $JSON_FILE)" >> $GITHUB_OUTPUT
            echo "md_lines=$(wc -l < $MD_FILE)" >> $GITHUB_OUTPUT
            echo "Outputs generated successfully"
          else
            echo "json_exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Output files not found"
            exit 1
          fi
      
      - name: Create latest copy (optional)
        id: latest
        run: |
          TARGET_DATE=${{ steps.generate.outputs.target_date }}
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(date +%Y-%m-%d)
          fi
          
          # Create latest copies (fixed filename for easy reference)
          cp "poly-knowledge/outputs/weather-aviation-sources-${TARGET_DATE}.json" \
             "poly-knowledge/outputs/weather-aviation-sources-latest.json"
          cp "poly-knowledge/outputs/weather-aviation-sources-${TARGET_DATE}.md" \
             "poly-knowledge/outputs/weather-aviation-sources-latest.md"
          
          echo "latest_created=true" >> $GITHUB_OUTPUT
          echo "Created latest copies"
      
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      - name: Commit and push outputs
        run: |
          TARGET_DATE=${{ steps.generate.outputs.target_date }}
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(date +%Y-%m-%d)
          fi
          
          # Stage all output files (dated + latest)
          git add "poly-knowledge/outputs/weather-aviation-sources-${TARGET_DATE}.json"
          git add "poly-knowledge/outputs/weather-aviation-sources-${TARGET_DATE}.md"
          git add "poly-knowledge/outputs/weather-aviation-sources-latest.json"
          git add "poly-knowledge/outputs/weather-aviation-sources-latest.md"
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new outputs to commit"
          else
            # Commit with date
            git commit -m "docs: add weather-aviation-sources for ${TARGET_DATE}
            
            - Generated via GitHub Actions
            - Auto-committed weather & aviation data sources
            - Include latest copies for KB sync
            - Sources: NOAA/NWS API, METAR/TAF"
            
            # Push changes
            git push
            echo "Committed and pushed weather-aviation-sources for ${TARGET_DATE}"
          fi
      
      - name: Upload artifacts (backup)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: weather-aviation-outputs
          path: |
            poly-knowledge/outputs/weather-aviation-sources-*.json
            poly-knowledge/outputs/weather-aviation-sources-*.md
          retention-days: 7
          if-no-files-found: ignore

  # Summary job
  summary:
    needs: generate-weather-aviation
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          if [ "${{ needs.generate-weather-aviation.result }}" == "success" ]; then
            echo "✅ Weather Aviation Sources generation completed successfully"
            echo "Date: ${{ needs.generate-weather-aviation.outputs.target_date }}"
            echo "JSON size: ${{ needs.generate-weather-aviation.outputs.json_size }} bytes"
            echo "MD lines: ${{ needs.generate-weather-aviation.outputs.md_lines }}"
            echo "Latest copy: ${{ needs.generate-weather-aviation.outputs.latest_created }}"
          else
            echo "❌ Weather Aviation Sources generation failed"
            echo "Check workflow logs for details"
          fi
