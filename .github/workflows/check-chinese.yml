name: 中文占比检查

on:
  push:
    branches: [main, master]
    paths:
      - 'poly-knowledge/**/*.md'
  pull_request:
    paths:
      - 'poly-knowledge/**/*.md'

jobs:
  check-chinese:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
      
      - name: 运行中文占比检查
        run: |
          python check_chinese_ratio.py --threshold 25 poly-knowledge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 输出失败信息
        if: failure()
        run: |
          echo "❌ 检查失败：部分文件的英文占比超过 25%"
          echo ""
          echo "请将超过阈值的文件翻译为中文，或在代码块/链接中保持英文。"
          echo ""
          echo "详细说明见 CONTRIBUTING.md"
